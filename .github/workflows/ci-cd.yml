name: CI/CD Pipeline — NovaMart Chatbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────
  # JOB 1 — Tests (CI)
  # ─────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test_key
          AWS_SECRET_ACCESS_KEY: test_secret
          BEDROCK_KNOWLEDGE_BASE_ID: test_kb_id
          BEDROCK_MODEL_ARN: test_arn
          ANTHROPIC_API_KEY: test_anthropic
          GROQ_API_KEY: test_groq
          REDIS_URL: ""
          DASHBOARD_USERNAME: admin
          DASHBOARD_PASSWORD: novamart2026
          SMTP_EMAIL: ""
          SMTP_PASSWORD: ""
          SUPPORT_EMAIL: ""
          RESEND_API_KEY: ""
        run: |
          cd backend
          python -m pytest test_chat.py -v --tb=short

  # ─────────────────────────────────────
  # JOB 2 — Deploy (CD)
  # ─────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach

      - name: Deployment success notification
        run: |
          echo "✅ Déploiement réussi sur Railway !"
          echo "🌐 URL: https://web-production-fb44b.up.railway.app"
          echo "📊 Dashboard: https://web-production-fb44b.up.railway.app/dashboard"
