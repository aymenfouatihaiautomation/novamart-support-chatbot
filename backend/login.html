<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaMart — Connexion Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}
.login-card {
    background: white;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.logo {
    text-align: center;
    margin-bottom: 32px;
}
.logo h1 {
    font-size: 28px;
    font-weight: 800;
    color: #2563EB;
}
.logo p {
    color: #6b7280;
    font-size: 14px;
    margin-top: 4px;
}
.form-group {
    margin-bottom: 20px;
}
label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
}
input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    font-size: 14px;
    color: #111827;
    transition: border-color 0.2s;
}
input:focus {
    outline: none;
    border-color: #2563EB;
}
.btn {
    width: 100%;
    padding: 14px;
    background: #2563EB;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
}
.btn:hover { background: #1D4ED8; }
.btn:disabled { background: #93C5FD; cursor: not-allowed; }
.error {
    background: #FEE2E2;
    color: #DC2626;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
}
</style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <h1>NovaMart</h1>
        <p>Dashboard Support — Connexion</p>
    </div>
    <div class="error" id="error-msg"></div>
    <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn" onclick="login()">Se connecter</button>
</div>

<script>
async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    if (!username || !password) {
        showError('Veuillez remplir tous les champs.');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Connexion...';
    errorMsg.style.display = 'none';

    try {
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);

        const res = await fetch('/auth/login', {
            method: 'POST',
            body: formData
        });

        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('novamart_token', data.access_token);
            window.location.href = '/dashboard';
        } else {
            showError(data.detail || 'Identifiants incorrects.');
        }
    } catch(e) {
        showError('Erreur de connexion au serveur.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
    }
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
});

// Redirect si déjà connecté
const token = localStorage.getItem('novamart_token');
if (token) window.location.href = '/dashboard';
</script>
</body>
</html>
